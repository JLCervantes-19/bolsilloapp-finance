<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- One Million — ícono de la app. Monograma "1M" dibujado con trazos
       (no depende de fuentes) + moneda de acento, que es el punto del
       logotipo "One Million.". Todo cabe en la zona segura maskable (80%). -->
  <defs>
    <radialGradient id="bloomA" cx="20%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#3a2f7a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3a2f7a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bloomB" cx="88%" cy="90%" r="60%">
      <stop offset="0%" stop-color="#0ea894" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0ea894" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="ink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dfe3ee"/>
    </linearGradient>
    <linearGradient id="coin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb18c"/>
      <stop offset="100%" stop-color="#ff7d47"/>
    </linearGradient>
  </defs>

  <!-- fondo base -->
  <rect width="1024" height="1024" fill="#0c0d14"/>
  <rect width="1024" height="1024" fill="url(#bloomA)"/>
  <rect width="1024" height="1024" fill="url(#bloomB)"/>

  <!-- tarjeta de vidrio -->
  <rect x="172" y="252" width="680" height="520" rx="96"
        fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.30" stroke-width="5"/>

  <!-- monograma 1M -->
  <g fill="none" stroke="url(#ink)" stroke-width="74" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 252 410 L 312 358 L 312 664"/>
    <path d="M 404 664 L 404 358 L 548 548 L 692 358 L 692 664"/>
  </g>

  <!-- moneda de acento (el punto de "One Million.") -->
  <circle cx="782" cy="652" r="46" fill="url(#coin)"/>
</svg>
